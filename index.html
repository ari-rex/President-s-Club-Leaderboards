/* Layout: gradient hero band with logo, club tabs and language switch; white content column below with summary tiles, podium, filterable ranking table. Single light theme by brand choice. */
:root {
  color-scheme: light;
  --cial-deep: #0050f0;
  --cial-bright: #00d2ff;
  --grad: linear-gradient(90deg, #0050f0 10%, #00d2ff 90%);
  --grad-hero: linear-gradient(115deg, #0050f0 0%, #00d2ff 100%);
  --title: #4b4b4b;
  --body: #7c7c7c;
  --muted: #a0a0a0;
  --surface-0: #ffffff;
  --surface-1: #fafbfc;
  --surface-2: #f4f7fb;
  --on-blue: #ffffff;
  --on-blue-soft: rgba(255,255,255,0.78);
  --hair: rgba(0,0,0,0.06);
  --brand-line: rgba(0,80,240,0.20);
  --tint: rgba(0,80,240,0.05);
  --shadow-md: 0 1px 0 rgba(0,0,0,0.02), 0 8px 30px -20px rgba(0,80,240,0.25);
  --shadow-glow: 0 18px 40px -18px rgba(0,80,240,0.35);
  --font: "Open Sans", Arial, sans-serif;
  --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --pill: 9999px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font-family: var(--font); background: var(--surface-1); color: var(--title); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Hero */
.hero { background: var(--grad-hero); color: var(--on-blue); position: relative; overflow: hidden; }
.hero .wrap { padding-block: 28px 0; position: relative; z-index: 1; }
.pills { position: absolute; right: -40px; top: 96px; display: grid; gap: 14px; justify-items: end; pointer-events: none; }
.pills span { display: block; height: 34px; border-radius: var(--pill); border: 2px solid rgba(255,255,255,0.28); }
.topline { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.logo svg { height: 34px; width: auto; display: block; }
.lang { display: inline-flex; background: rgba(255,255,255,0.14); border-radius: var(--pill); padding: 4px; gap: 2px; }
.lang button { font: 700 12px/1 var(--font); letter-spacing: 0.08em; color: var(--on-blue); background: transparent; border: 0; height: 30px; padding: 0 14px; border-radius: var(--pill); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--on-blue); color: var(--cial-deep); }
.headline { padding-block: 40px 28px; max-width: 720px; }
.eyebrow { font: 700 11px/1.4 var(--font); text-transform: uppercase; letter-spacing: 0.22em; }
.hero .eyebrow { color: var(--on-blue-soft); }
h1 { font-weight: 800; font-size: clamp(38px, 6.4vw, 72px); line-height: 0.98; letter-spacing: -0.035em; margin: 10px 0 0; text-wrap: balance; }
.sub { font-weight: 300; font-size: clamp(17px, 2vw, 22px); line-height: 1.4; margin: 14px 0 0; color: var(--on-blue); }
.hero-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.headline { min-width: 0; }
.badge { width: clamp(180px, 22vw, 260px); height: auto; flex: none; margin-block: -8px 4px; }
.hero.pc .pills { display: none; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { font: 700 14px/1 var(--font); height: 48px; padding: 0 22px; border: 0; cursor: pointer; border-radius: 16px 16px 0 0; background: rgba(255,255,255,0.16); color: var(--on-blue); }
.tabs button[aria-selected="true"] { background: var(--surface-1); color: var(--cial-deep); }
button:focus-visible { outline: 3px solid var(--cial-bright); outline-offset: 2px; }

/* Content */
main .wrap { padding-block: 32px 48px; display: grid; gap: 32px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; }
.tile { background: var(--surface-0); border: 1px solid var(--hair); border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow-md); min-width: 0; }
.tile .eyebrow { color: var(--cial-deep); }
.tile .num { font-weight: 800; font-size: 34px; line-height: 1.1; letter-spacing: -0.03em; margin-top: 8px; font-variant-numeric: tabular-nums; background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
.tile .note { font-size: 13px; color: var(--body); margin-top: 4px; }

.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.section-head .eyebrow { color: var(--cial-deep); }
h2 { font-weight: 800; font-size: clamp(24px, 3vw, 32px); letter-spacing: -0.02em; line-height: 1.2; margin: 6px 0 0; }

.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 16px; align-items: end; }
.place { background: var(--surface-0); border: 1px solid var(--hair); border-radius: var(--r-xl); padding: 22px; box-shadow: var(--shadow-md); min-width: 0; display: grid; gap: 10px; }
.place.p1 { box-shadow: var(--shadow-glow); border-color: var(--brand-line); padding-block: 34px; }
.place .rank { font-weight: 800; font-size: 56px; line-height: 0.9; letter-spacing: -0.04em; background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
.place.p1 .rank { font-size: 76px; }
.place .name { font-weight: 800; font-size: 20px; line-height: 1.2; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.place .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.place .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.place { border-top: 4px solid var(--metal); }
.place.p1 { --metal: #d4a72c; } .place.p2 { --metal: #a7b0ba; } .place.p3 { --metal: #b8743d; }
.trophy { width: 64px; height: 64px; flex: none; filter: drop-shadow(0 6px 10px rgba(0,80,240,0.18)); }
.place.p1 .trophy { width: 88px; height: 88px; }
.place.p1 { --metal-text: #9a7412; } .place.p2 { --metal-text: #6e7782; } .place.p3 { --metal-text: #8a5326; }
td.rank .tr-sm { width: 18px; height: 18px; vertical-align: -3px; margin-left: 6px; }
@media (prefers-reduced-motion: no-preference) {
  .place.p1 .trophy { animation: bob 3.2s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
}
.place .votes { font-weight: 300; font-size: 15px; color: var(--body); }

.chip { display: inline-flex; align-items: center; height: 26px; padding: 0 12px; border-radius: var(--pill); font: 700 12px/1 var(--font); white-space: nowrap; }
.chip.new { background: var(--cial-deep); color: var(--on-blue); }
.chip.renew { background: transparent; color: var(--cial-deep); box-shadow: inset 0 0 0 1.5px var(--cial-deep); }
.chip.mkt { background: var(--surface-2); color: var(--title); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button { font: 700 13px/1 var(--font); height: 36px; padding: 0 16px; border-radius: var(--pill); border: 1px solid var(--brand-line); background: var(--surface-0); color: var(--cial-deep); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--cial-deep); color: var(--on-blue); border-color: var(--cial-deep); }
.filters .count { font-weight: 400; opacity: 0.75; margin-left: 6px; }

.table-card { background: var(--surface-0); border: 1px solid var(--hair); border-radius: var(--r-lg); box-shadow: var(--shadow-md); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; padding: 12px 16px; font: 700 11px/1 var(--font); letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
td { padding: 11px 16px; border-bottom: 1px solid var(--hair); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--tint); }
td.rank { font-weight: 800; color: var(--cial-deep); width: 76px; white-space: nowrap; font-variant-numeric: tabular-nums; }
td.name { font-weight: 700; color: var(--title); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.n { color: var(--body); }
td.total { font-weight: 800; color: var(--title); }
tr.top3 td.rank { font-size: 17px; }
.empty { padding: 28px 16px; color: var(--body); text-align: center; }

.stack { display: grid; gap: 32px; }
.cta { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: var(--surface-0); border: 1px solid var(--brand-line); border-radius: var(--r-lg); padding: 20px 24px; box-shadow: var(--shadow-md); }
.cta .eyebrow { color: var(--cial-deep); }
.cta p { margin: 6px 0 0; font-size: 15px; color: var(--body); max-width: 60ch; }
.btn, #cta-btn { font: 700 14px/1 var(--font); height: 44px; padding: 0 22px; border: 0; border-radius: var(--pill); background: var(--grad); color: var(--on-blue); cursor: pointer; }
.lead { font-size: 16px; line-height: 1.65; color: var(--body); margin: 10px 0 0; max-width: 70ch; }
.awards { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 16px; margin-top: 20px; }
.award { background: var(--surface-0); border: 1px solid var(--hair); border-radius: var(--r-lg); padding: 18px 18px 20px; box-shadow: var(--shadow-md); min-width: 0; display: grid; gap: 6px; align-content: start; }
.award .count { font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -0.03em; background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
.award .who { font-weight: 800; font-size: 16px; color: var(--title); }
.award .det { font-size: 13px; line-height: 1.5; color: var(--body); }
.award .val { margin-top: 6px; justify-self: start; }
.chip.val { background: var(--tint); color: var(--cial-deep); box-shadow: inset 0 0 0 1px var(--brand-line); }
.weights { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; margin-top: 20px; }
.weight { background: var(--surface-0); border: 1px solid var(--hair); border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow-md); min-width: 0; }
.weight .x { font-weight: 800; font-size: 36px; line-height: 1; letter-spacing: -0.03em; color: var(--cial-deep); font-variant-numeric: tabular-nums; }
.weight .what { margin-top: 8px; font-size: 14px; line-height: 1.5; color: var(--title); font-weight: 700; }
.criteria { list-style: none; counter-reset: c; margin: 20px 0 0; padding: 0; display: grid; gap: 12px; }
.criteria li { counter-increment: c; display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; background: var(--surface-0); border: 1px solid var(--hair); border-radius: var(--r-lg); padding: 16px 20px; }
.criteria li::before { content: counter(c); display: grid; place-items: center; width: 34px; height: 34px; border-radius: var(--pill); background: var(--grad); color: var(--on-blue); font: 800 15px/1 var(--font); }
.criteria li span { font-size: 15px; line-height: 1.6; color: var(--title); padding-top: 5px; }
.fine { font-size: 13px; line-height: 1.6; color: var(--body); margin: 12px 0 0; }
.facts { list-style: none; margin: 20px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.facts li { background: var(--surface-2); border-radius: var(--r-lg); padding: 16px 20px; font-size: 14px; line-height: 1.6; color: var(--title); min-width: 0; }
.facts li b { display: block; font-weight: 700; margin-bottom: 4px; }
.how { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.how div { background: var(--surface-2); border-radius: var(--r-lg); padding: 18px 20px; min-width: 0; }
.how h3 { font-weight: 700; font-size: 16px; margin: 0 0 6px; color: var(--title); }
.how p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--body); }
footer { font-size: 12px; color: var(--muted); line-height: 1.6; }

@media (max-width: 1000px) and (min-width: 761px) { .awards { grid-template-columns: repeat(3, minmax(0,1fr)); } }
@media (max-width: 760px) {
  .tiles { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .podium { grid-template-columns: 1fr; }
  .podium .p1 { order: -1; }
  .how, .facts { grid-template-columns: 1fr; }
  .awards { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .weights { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .pills { display: none; }
  .hero-row { flex-direction: column-reverse; align-items: flex-start; gap: 0; }
  .badge { width: 150px; margin: 24px 0 -16px; }
  td, th { padding-left: 10px; padding-right: 10px; }
  .hide-sm { display: none; }
  .tabs { gap: 4px; }
  .tabs button { font-size: 12.5px; padding: 0 12px; height: 44px; }
}
@media (prefers-reduced-motion: no-preference) {
  .place, .tile { transition: transform 300ms cubic-bezier(.2,.9,.2,1.1); }
  .place:hover, .tile:hover { transform: translateY(-3px); }
}
</style>

  $("podium").innerHTML = order.map(i => {
    const r = rows[i]; if (!r) return "";
    const meta = sales ? typeChip(t, r[1]) + mktChip(t, r[2]) : mktChip(t, r[1]) + `<span class="votes">${esc(t.votes(r[3]))}</span>`;
    return `<article class="place p${i+1}"><div class="top"><div class="rank">${i+1}</div>${trophy(i, "trophy")}</div><div class="name">${esc(r[0])}</div><div class="meta">${meta}</div></article>`;
  }).join("");

  $("table-eyebrow").textContent = t.tblEyebrow; $("table-title").textContent = sales ? t.tblSales : t.tblAcc;
  const counts = {}; rows.forEach(r => { const m = r[sales ? 2 : 1]; counts[m] = (counts[m] || 0) + 1; });
  $("filters").innerHTML = ["all", ...MARKETS].map(m =>
    `<button data-m="${m}" aria-pressed="${state.market === m}">${esc(m === "all" ? t.all : t.mk[m])}<span class="count">${m === "all" ? rows.length : (counts[m] || 0)}</span></button>`).join("");

  $("thead").innerHTML = sales
    ? `<tr><th>${t.rank}</th><th>${esc(t.seller)}</th><th>${esc(t.type)}</th><th>${esc(t.market)}</th></tr>`
    : `<tr><th>${t.rank}</th><th>${esc(t.accel)}</th><th>${esc(t.market)}</th>${DATA.acc.quarters.map(q => `<th class="n hide-sm">${esc(q)}</th>`).join("")}<th class="n">${esc(t.total)}</th></tr>`;
  const shown = rows.map((r, i) => [i + 1, r]).filter(([, r]) => state.market === "all" || r[sales ? 2 : 1] === state.market);
  $("tbody").innerHTML = shown.length ? shown.map(([n, r]) => sales
    ? `<tr class="${n <= 3 ? "top3" : ""}"><td class="rank">${n}${n <= 3 ? trophy(n-1, "tr-sm") : ""}</td><td class="name">${esc(r[0])}</td><td>${typeChip(t, r[1])}</td><td>${mktChip(t, r[2])}</td></tr>`
    : `<tr class="${n <= 3 ? "top3" : ""}"><td class="rank">${n}${n <= 3 ? trophy(n-1, "tr-sm") : ""}</td><td class="name">${esc(r[0])}</td><td>${mktChip(t, r[1])}</td>${r[2].map(v => `<td class="n hide-sm">${v}</td>`).join("")}<td class="n total">${r[3]}</td></tr>`
  ).join("") : `<tr><td colspan="9" class="empty">${esc(t.noRows)}</td></tr>`;

  const note = !sales && DATA.acc.note ? " " + (DATA.acc.note[state.lang] || DATA.acc.note.en || "") : "";
  $("source").textContent = (sales ? t.sourceSales(new Date(DATA.sales.pulled + "T12:00:00").toLocaleDateString(t.loc, {year:"numeric",month:"long",day:"numeric"})) : t.sourceAcc(DATA.acc.period)) + note;
}

document.querySelector(".lang").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.lang = b.dataset.lang; store("pc-lang", state.lang); render(); });
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.tab = b.dataset.tab; state.market = "all"; store("pc-tab", state.tab); render(); });
$("cta-btn").addEventListener("click", () => { state.tab = "rules"; store("pc-tab", "rules"); render(); window.scrollTo({top: 0, behavior: "smooth"}); });
$("filters").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.market = b.dataset.m; render(); });
render();
</script>
</body></html>
